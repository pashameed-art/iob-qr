<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111214;color:#f4f4f5;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;padding:14px}
main{width:min(100%,760px);background:#1d1e20;border-radius:30px;padding:42px 38px 34px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.header{display:flex;align-items:center;gap:20px;margin:0 0 42px 20px}
.avatar{width:78px;height:78px;border-radius:50%;background:#526875;border:2px solid #71818a;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:400}
.name{font-size:clamp(38px,6vw,64px);font-weight:700;letter-spacing:-1.5px;white-space:nowrap}
.qr{display:block;width:min(100%,650px);margin:0 auto;border-radius:2px}
.hint{text-align:center;font-size:clamp(22px,3.4vw,34px);font-weight:700;margin:30px 0 48px}
.bank{display:flex;align-items:center;gap:22px;justify-content:center;margin-bottom:50px}
.bank img{width:110px;height:62px;object-fit:contain;background:white;border-radius:10px;padding:4px}
.bank span{font-size:clamp(24px,4vw,38px);font-weight:700}
.upi{font-size:clamp(23px,3.7vw,34px);font-weight:700;text-align:center;overflow-wrap:anywhere}
@media(max-width:520px){
main{padding:28px 18px 28px;border-radius:24px}
.header{margin-left:4px;margin-bottom:28px;gap:14px}
.avatar{width:58px;height:58px;font-size:34px}
.name{font-size:31px;letter-spacing:-.7px}
.hint{font-size:18px;margin:22px 0 34px}
.bank{gap:12px;margin-bottom:30px}
.bank img{width:78px;height:46px}
.bank span{font-size:19px}
.upi{font-size:18px}
}
</style>
