<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#263746;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:22px 0}
main{width:min(84vw,590px);background:#f1f5fb;border-radius:28px;padding:28px 20px 20px;box-shadow:0 7px 24px rgba(70,90,120,.10);border:1px solid #e7edf5}
.header{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 18px}
.avatar{width:50px;height:50px;flex:0 0 50px;border-radius:50%;background:#536875;color:#fff;border:2px solid #71818a;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:400}
.name{font-size:clamp(25px,5.2vw,38px);font-weight:700;letter-spacing:-.7px;white-space:nowrap;color:#17212b}
.qr{display:block;width:min(100%,410px);height:auto;margin:0 auto;border-radius:7px}
.hint{text-align:center;font-size:clamp(17px,3.7vw,23px);font-weight:600;margin:15px 0 17px;color:#263746}
.bank{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 15px;padding:8px 8px;background:#e8f1fd;border-radius:13px;white-space:nowrap;overflow:hidden}
.bank img{width:54px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;flex:0 0 auto}
.bank span{font-size:clamp(15px,3.4vw,21px);font-weight:700;white-space:nowrap;color:#183f6c}
.upi{font-size:clamp(15px,3.5vw,20px);font-weight:600;text-align:center;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border:1px solid #dfe7f0;border-radius:13px;color:#263f55;background:#fff}
.copy{border:0;background:transparent;color:#536b7d;padding:3px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.copy svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2}
.copied{font-weight:700}
@media(max-width:380px){main{width:84vw;padding:22px 12px 15px}.header{gap:9px;margin-bottom:14px}.avatar{width:44px;height:44px;flex-basis:44px;font-size:24px}.name{font-size:24px}.qr{width:min(100%,330px)}.hint{margin:12px 0 14px;font-size:16px}.bank{gap:6px;padding:7px 6px}.bank img{width:46px;height:33px}.bank span{font-size:14px}.upi{font-size:13px;padding:9px 6px}}
</style>
